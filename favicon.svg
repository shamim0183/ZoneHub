<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient: Deep Electric Indigo to Cyan -->
    <linearGradient id="zoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Center Pulse Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="hubGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#zoneGrad)" filter="url(#hubGlow)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.35"/>

  <!-- Radiating Network Orbit Rings (Local Zone / Wi-Fi Signal) -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.22" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Network Connection Beams (Connecting Nodes) -->
  <line x1="32" y1="20" x2="21" y2="40" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="43" y2="40" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"/>
  <line x1="21" y1="40" x2="43" y2="40" stroke="#ffffff" stroke-width="2.2" stroke-opacity="0.85" stroke-linecap="round"/>

  <!-- Center Hub Aura / Broadcast Wave -->
  <circle cx="32" cy="33.3" r="7.5" fill="url(#centerGlow)" opacity="0.7"/>
  <circle cx="32" cy="33.3" r="2.2" fill="#ffffff"/>

  <!-- Connected Community Nodes (Local Devices & Team Members) -->
  <!-- Top Node (Hub Server / Host PC) -->
  <circle cx="32" cy="20" r="5" fill="#ffffff"/>
  <circle cx="32" cy="20" r="3" fill="#4f46e5"/>

  <!-- Bottom Left Node (Mobile Device / Member 1) -->
  <circle cx="21" cy="40" r="4.5" fill="#ffffff"/>
  <circle cx="21" cy="40" r="2.6" fill="#06b6d4"/>

  <!-- Bottom Right Node (Laptop / Member 2) -->
  <circle cx="43" cy="40" r="4.5" fill="#ffffff"/>
  <circle cx="43" cy="40" r="2.6" fill="#10b981"/>
</svg>
