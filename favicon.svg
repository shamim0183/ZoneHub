<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#hubGrad)" filter="url(#glow)"/>
  
  <!-- Subtle border highlight -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
  
  <!-- Camera Body -->
  <rect x="15" y="20" width="22" height="24" rx="5" fill="url(#lensGrad)"/>
  
  <!-- Camera Lens Triangle -->
  <path d="M39 26.5 L48 20.5 C49 19.8 50 20.4 50 21.6 L50 42.4 C50 43.6 49 44.2 48 43.5 L39 37.5 Z" fill="url(#lensGrad)"/>
  
  <!-- Play Hub Dot in center -->
  <circle cx="26" cy="32" r="3.5" fill="#6366f1"/>
</svg>
